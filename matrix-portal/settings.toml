# Matrix Portal M4 Configuration
# Copy this file to settings.toml on your CIRCUITPY drive
# Run companion/companion.py on your desktop first to get a Spotify refresh token

# WiFi
CIRCUITPY_WIFI_SSID = "your_wifi_ssid"
CIRCUITPY_WIFI_PASSWORD = "your_wifi_password"

# Spotify — get SPOTIFY_REFRESH_TOKEN by running: python companion/companion.py --auth
SPOTIFY_CLIENT_ID = ""
SPOTIFY_CLIENT_SECRET = ""
SPOTIFY_REFRESH_TOKEN = ""

# OpenWeatherMap (https://openweathermap.org/api)
OPENWEATHER_API_KEY = ""
WEATHER_LOCATION = "New York,US"
WEATHER_UNITS = "imperial"

# Sports (ESPN API — no key needed)
ESPN_LEAGUE = "NBA"
ESPN_TEAM = "LAL"

# Display
BRIGHTNESS = 50
DEFAULT_MODE = "music"

# Desktop companion URL (e.g. "http://192.168.1.100:5001")
# Required for album art and the web control panel
# Leave empty to run without companion (album art disabled)
COMPANION_URL = ""

# Timezone offset from UTC in hours (e.g. -5 for EST, -8 for PST)
TIMEZONE_OFFSET = -5

# Screensaver: "pipes", "dvd", or "both" (alternates)
SCREENSAVER_TYPE = "both"

# Schedule: comma-separated list of "HH:MM=mode" entries
# Example: "07:00=clock,09:00=music,22:00=screensaver"
MODE_SCHEDULE = ""

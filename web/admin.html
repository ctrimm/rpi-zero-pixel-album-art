<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin · LED Matrix Display</title>
    <style>
        :root {
            --bg: #0f0f10;
            --surface: #18181a;
            --surface-2: #202023;
            --surface-3: #2a2a2e;
            --border: #2e2e33;
            --text: #f2f2f3;
            --muted: #a1a1aa;
            --faint: #71717a;
            --accent: #1DB954;
            --accent-hover: #1ed760;
            --accent-soft: rgba(29, 185, 84, 0.12);
            --warn: #f5a524;
            --warn-soft: rgba(245, 165, 36, 0.12);
            --danger: #f04a4a;
            --danger-soft: rgba(240, 74, 74, 0.12);
            --radius: 12px;
            --radius-sm: 8px;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Ubuntu, sans-serif;
            background: var(--bg);
            color: var(--text);
            min-height: 100vh;
            line-height: 1.45;
            -webkit-font-smoothing: antialiased;
        }

        button, input, select, textarea { font: inherit; color: inherit; }

        /* ---------- Top bar ---------- */
        .topbar {
            position: sticky; top: 0; z-index: 20;
            background: rgba(15, 15, 16, 0.85);
            backdrop-filter: blur(10px);
            border-bottom: 1px solid var(--border);
        }
        .topbar-inner {
            max-width: 1120px; margin: 0 auto; padding: 14px 24px;
            display: flex; align-items: center; justify-content: space-between; gap: 16px;
        }
        .brand { display: flex; align-items: center; gap: 12px; }
        .brand-mark {
            width: 34px; height: 34px; border-radius: 8px;
            display: grid; grid-template-columns: repeat(4, 1fr); gap: 2px; padding: 5px;
            background: #000; border: 1px solid var(--border);
        }
        .brand-mark span { border-radius: 50%; background: var(--accent); opacity: .25; }
        .brand-mark span.on { opacity: 1; }
        .brand-title { font-weight: 700; font-size: 1.05rem; }
        .brand-sub { color: var(--faint); font-size: .8rem; }
        .top-actions { display: flex; gap: 8px; }

        /* ---------- Buttons ---------- */
        .btn {
            display: inline-flex; align-items: center; justify-content: center; gap: 6px;
            padding: 9px 16px; border-radius: 999px; border: 1px solid var(--border);
            background: var(--surface-2); color: var(--text);
            font-size: .9rem; font-weight: 600; cursor: pointer;
            transition: background .15s, border-color .15s, transform .05s;
            text-decoration: none; white-space: nowrap;
        }
        .btn:hover { background: var(--surface-3); }
        .btn:active { transform: translateY(1px); }
        .btn:disabled { opacity: .5; cursor: default; }
        .btn-primary { background: var(--accent); border-color: var(--accent); color: #04140a; }
        .btn-primary:hover { background: var(--accent-hover); }
        .btn-ghost { background: transparent; }
        .btn-sm { padding: 6px 12px; font-size: .82rem; }

        /* ---------- Layout ---------- */
        .page { max-width: 1120px; margin: 0 auto; padding: 24px 24px 120px; }

        .banner {
            display: none; align-items: flex-start; gap: 12px;
            padding: 14px 16px; border-radius: var(--radius);
            background: var(--warn-soft); border: 1px solid rgba(245, 165, 36, .35);
            color: #fcd38a; margin-bottom: 20px; font-size: .92rem;
        }
        .banner.show { display: flex; }
        .banner a { color: #fff; font-weight: 600; cursor: pointer; text-decoration: underline; }

        /* ---------- Status tiles ---------- */
        .stats {
            display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 12px;
            margin-bottom: 24px;
        }
        .stat {
            background: var(--surface); border: 1px solid var(--border);
            border-radius: var(--radius); padding: 14px 16px; min-width: 0;
        }
        .stat-label { color: var(--faint); font-size: .75rem; text-transform: uppercase; letter-spacing: .06em; }
        .stat-value {
            margin-top: 4px; font-size: 1.15rem; font-weight: 700;
            white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
            display: flex; align-items: center; gap: 8px;
        }
        .stat-sub { color: var(--muted); font-size: .8rem; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--faint); flex: none; }
        .dot.ok { background: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
        .dot.warn { background: var(--warn); }
        .dot.bad { background: var(--danger); }

        /* ---------- Settings shell ---------- */
        .shell { display: grid; grid-template-columns: 210px 1fr; gap: 24px; align-items: start; }

        .nav { position: sticky; top: 84px; display: flex; flex-direction: column; gap: 2px; scroll-margin-top: 80px; }
        .nav button {
            display: flex; align-items: center; gap: 10px; width: 100%;
            text-align: left; padding: 10px 12px; border-radius: var(--radius-sm);
            border: none; background: transparent; color: var(--muted);
            font-size: .93rem; font-weight: 500; cursor: pointer;
        }
        .nav button:hover { background: var(--surface); color: var(--text); }
        .nav button.active { background: var(--accent-soft); color: var(--accent); font-weight: 600; }
        .nav .icon { width: 20px; text-align: center; }

        .section { display: none; }
        .section.active { display: block; }
        .section-head { margin-bottom: 16px; }
        .section-head h2 { font-size: 1.35rem; }
        .section-head p { color: var(--muted); font-size: .92rem; margin-top: 2px; }

        .card {
            background: var(--surface); border: 1px solid var(--border);
            border-radius: var(--radius); margin-bottom: 16px; overflow: hidden;
        }
        .card-title {
            padding: 14px 20px; border-bottom: 1px solid var(--border);
            font-weight: 600; font-size: .95rem; display: flex; align-items: center; justify-content: space-between; gap: 8px;
        }
        .card-body { padding: 4px 20px; }
        .card-note { padding: 14px 20px; color: var(--muted); font-size: .88rem; border-top: 1px solid var(--border); }
        .card-note code, .help code {
            background: var(--surface-3); padding: 1px 6px; border-radius: 4px;
            font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: .85em; color: var(--text);
        }

        /* ---------- Fields ---------- */
        .field {
            display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 300px);
            gap: 16px; align-items: center; padding: 14px 0;
            border-bottom: 1px solid var(--border);
        }
        .field:last-child { border-bottom: none; }
        .field.disabled { opacity: .45; }
        .field-label { font-weight: 500; font-size: .93rem; display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
        .help { color: var(--faint); font-size: .82rem; margin-top: 2px; }
        .badge {
            font-size: .68rem; font-weight: 700; text-transform: uppercase; letter-spacing: .05em;
            padding: 2px 7px; border-radius: 999px; background: var(--surface-3); color: var(--muted);
        }
        .badge.warn { background: var(--warn-soft); color: var(--warn); }
        .badge.ok { background: var(--accent-soft); color: var(--accent); }
        .badge.bad { background: var(--danger-soft); color: var(--danger); }

        .control { display: flex; justify-content: flex-end; align-items: center; gap: 8px; min-width: 0; }
        .input, .select {
            width: 100%; padding: 9px 12px; border-radius: var(--radius-sm);
            background: var(--bg); border: 1px solid var(--border); outline: none;
            transition: border-color .15s, box-shadow .15s;
        }
        .input:focus, .select:focus { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
        .input.invalid { border-color: var(--danger); }
        .input[type=number] { max-width: 120px; text-align: right; }
        .select { cursor: pointer; }

        .input-wrap { position: relative; width: 100%; }
        .input-wrap .input { padding-right: 58px; }
        .reveal {
            position: absolute; right: 6px; top: 50%; transform: translateY(-50%);
            border: none; background: transparent; color: var(--muted); font-size: .78rem; font-weight: 600;
            padding: 4px 6px; cursor: pointer;
        }
        .reveal:hover { color: var(--text); }

        /* Toggle switch */
        .switch { position: relative; width: 44px; height: 24px; flex: none; }
        .switch input { opacity: 0; width: 0; height: 0; }
        .slider {
            position: absolute; inset: 0; border-radius: 999px; cursor: pointer;
            background: var(--surface-3); transition: background .15s;
        }
        .slider::before {
            content: ""; position: absolute; width: 18px; height: 18px; left: 3px; top: 3px;
            border-radius: 50%; background: #fff; transition: transform .15s;
        }
        .switch input:checked + .slider { background: var(--accent); }
        .switch input:checked + .slider::before { transform: translateX(20px); }
        .switch input:focus-visible + .slider { box-shadow: 0 0 0 3px var(--accent-soft); }

        /* Range */
        .range-wrap { display: flex; align-items: center; gap: 12px; width: 100%; }
        .range-wrap output { min-width: 40px; text-align: right; font-variant-numeric: tabular-nums; color: var(--muted); }
        input[type=range] { flex: 1; accent-color: var(--accent); }

        /* Segmented control */
        .segmented { display: inline-flex; background: var(--bg); border: 1px solid var(--border); border-radius: 999px; padding: 3px; }
        .segmented button {
            border: none; background: transparent; padding: 6px 14px; border-radius: 999px;
            color: var(--muted); font-size: .85rem; font-weight: 600; cursor: pointer;
        }
        .segmented button.active { background: var(--surface-3); color: var(--text); }

        /* JSON editor */
        .editor {
            width: 100%; min-height: 460px; padding: 16px 20px; border: none; outline: none; resize: vertical;
            background: #0b0b0c; color: #d4d4d8; tab-size: 2;
            font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: .85rem; line-height: 1.55;
        }
        .editor-actions { display: flex; gap: 8px; flex-wrap: wrap; padding: 14px 20px; border-top: 1px solid var(--border); }
        .errors { display: none; padding: 12px 20px; background: var(--danger-soft); color: #fca5a5; font-size: .88rem; border-top: 1px solid var(--border); }
        .errors.show { display: block; }
        .errors ul { margin-left: 18px; }

        /* ---------- Save bar ---------- */
        .savebar {
            position: fixed; left: 50%; bottom: 20px; z-index: 30;
            transform: translate(-50%, 140%); transition: transform .25s ease;
            display: flex; align-items: center; gap: 12px;
            padding: 10px 10px 10px 18px; border-radius: 999px;
            background: var(--surface-2); border: 1px solid var(--border);
            box-shadow: 0 12px 40px rgba(0, 0, 0, .5); max-width: calc(100% - 32px);
        }
        .savebar.show { transform: translate(-50%, 0); }
        .savebar span { color: var(--muted); font-size: .9rem; white-space: nowrap; }

        /* ---------- Toasts ---------- */
        .toasts { position: fixed; top: 76px; right: 20px; z-index: 40; display: flex; flex-direction: column; gap: 8px; }
        .toast {
            padding: 12px 16px; border-radius: var(--radius-sm); font-size: .9rem; max-width: 360px;
            background: var(--surface-2); border: 1px solid var(--border); border-left: 3px solid var(--accent);
            box-shadow: 0 8px 30px rgba(0, 0, 0, .4); animation: in .2s ease;
        }
        .toast.error { border-left-color: var(--danger); }
        @keyframes in { from { opacity: 0; transform: translateY(-6px); } }

        .skeleton { color: var(--faint); padding: 40px 0; text-align: center; }

        /* ---------- Responsive ---------- */
        @media (max-width: 860px) {
            .stats { grid-template-columns: repeat(2, minmax(0, 1fr)); }
            .shell { grid-template-columns: 1fr; }
            .nav {
                position: static; flex-direction: row; overflow-x: auto; gap: 4px;
                margin: 0 -24px; padding: 0 24px 4px; scrollbar-width: none;
            }
            .nav button { width: auto; white-space: nowrap; }
        }
        @media (max-width: 600px) {
            .page, .topbar-inner { padding-left: 16px; padding-right: 16px; }
            .nav { margin: 0 -16px; padding: 0 16px 4px; }
            .field { grid-template-columns: 1fr; gap: 8px; }
            .control { justify-content: flex-start; }
            .brand-sub, .top-actions .btn-ghost .label { display: none; }
            .toasts { left: 16px; right: 16px; }
            .savebar {
                left: 12px; right: 12px; bottom: 12px; max-width: none;
                transform: translateY(140%); border-radius: 14px; padding: 10px 10px 10px 14px;
            }
            .savebar.show { transform: translateY(0); }
            .savebar span { flex: 1; white-space: normal; font-size: .85rem; }
        }
    </style>
</head>
<body>
    <header class="topbar">
        <div class="topbar-inner">
            <div class="brand">
                <div class="brand-mark" aria-hidden="true">
                    <span class="on"></span><span></span><span></span><span class="on"></span>
                    <span></span><span class="on"></span><span class="on"></span><span></span>
                    <span></span><span class="on"></span><span class="on"></span><span></span>
                    <span class="on"></span><span></span><span></span><span class="on"></span>
                </div>
                <div>
                    <div class="brand-title">Admin</div>
                    <div class="brand-sub">LED Matrix Display</div>
                </div>
            </div>
            <div class="top-actions">
                <a class="btn btn-ghost" href="/">← <span class="label">Dashboard</span></a>
                <button class="btn" onclick="logout()">Log out</button>
            </div>
        </div>
    </header>

    <main class="page">
        <div class="banner" id="passwordBanner">
            <span>⚠️</span>
            <div>You're still using the default admin password. Anyone on your network can change these settings.
                <a onclick="showSection('security')">Change it now</a></div>
        </div>

        <section class="stats" aria-label="Status">
            <div class="stat">
                <div class="stat-label">Showing</div>
                <div class="stat-value" id="statMode">–</div>
                <div class="stat-sub" id="statModeSub">&nbsp;</div>
            </div>
            <div class="stat">
                <div class="stat-label">Spotify</div>
                <div class="stat-value"><span class="dot" id="statSpotifyDot"></span><span id="statSpotify">–</span></div>
                <div class="stat-sub" id="statSpotifySub">&nbsp;</div>
            </div>
            <div class="stat">
                <div class="stat-label">Brightness</div>
                <div class="stat-value" id="statBrightness">–</div>
                <div class="stat-sub">&nbsp;</div>
            </div>
            <div class="stat">
                <div class="stat-label">Uptime</div>
                <div class="stat-value" id="statUptime">–</div>
                <div class="stat-sub" id="statUptimeSub">&nbsp;</div>
            </div>
        </section>

        <div class="shell">
            <nav class="nav" id="nav" aria-label="Settings sections"></nav>
            <div id="sections"><div class="skeleton">Loading settings…</div></div>
        </div>
    </main>

    <div class="savebar" id="savebar" role="region" aria-label="Unsaved changes">
        <span id="savebarText">You have unsaved changes</span>
        <button class="btn btn-ghost btn-sm" onclick="discardChanges()">Discard</button>
        <button class="btn btn-primary btn-sm" id="saveBtn" onclick="saveChanges()">Save changes</button>
    </div>

    <div class="toasts" id="toasts" aria-live="polite"></div>

    <script>
    // ------------------------------------------------------------------
    // Settings schema. Each field maps to a dotted path in config.json.
    // ------------------------------------------------------------------
    const MODES = [
        ['music', 'Music (album art)'], ['clock', 'Clock'], ['weather', 'Weather'],
        ['sports', 'Sports'], ['pipes', 'Pipes screensaver'], ['dvd_logo', 'DVD logo screensaver'],
    ];

    const SECTIONS = [
        {
            id: 'general', icon: '🎛️', title: 'General', desc: 'What the display shows and when.',
            cards: [
                { title: 'Display behaviour', fields: [
                    { path: 'display.brightness', label: 'Brightness', type: 'range', min: 0, max: 100, def: 80, suffix: '%' },
                    { path: 'modes.default', label: 'Default mode', help: 'Shown at start-up.', type: 'select', options: MODES, def: 'music' },
                    { path: 'modes.auto_switch', label: 'Automatic mode switching', help: 'Switch modes on their own based on music and schedules. Picking a mode by hand always wins until music starts again.', type: 'toggle', def: true },
                    { path: 'modes.schedule.music.auto', label: 'Show album art when music starts', type: 'toggle', def: true, dependsOn: 'modes.auto_switch' },
                    { path: 'modes.schedule.clock.fallback', label: 'Show the clock when music stops', type: 'toggle', def: true, dependsOn: 'modes.auto_switch' },
                ]},
                { title: 'Now playing', fields: [
                    { path: 'advanced.show_track_info', label: 'Show song & artist', help: 'Shown over the bottom of the album art. Long names scroll.', type: 'toggle', def: true },
                ]},
                { title: 'Clock', fields: [
                    { path: 'modes.schedule.clock.style', label: 'Style', type: 'segmented', options: [['analog', 'Analog'], ['digital', 'Digital']], def: 'analog' },
                    { path: 'clock.time_format', label: 'Time format', type: 'segmented', options: [['12h', '12-hour'], ['24h', '24-hour']], def: '12h' },
                    { path: 'clock.show_seconds', label: 'Show seconds', type: 'toggle', def: true },
                    { path: 'clock.show_date', label: 'Show date (digital)', type: 'toggle', def: true },
                ]},
            ],
        },
        {
            id: 'spotify', icon: '🎵', title: 'Spotify', desc: 'Credentials from developer.spotify.com/dashboard.',
            cards: [
                { title: 'Connection', status: 'spotify', fields: [
                    { path: 'spotify.client_id', label: 'Client ID', type: 'text', placeholder: '32-character ID' },
                    { path: 'spotify.client_secret', label: 'Client secret', type: 'secret' },
                    { path: 'spotify.redirect_uri', label: 'Redirect URI', help: 'Must exactly match the one in your Spotify app settings.', type: 'text', def: 'http://127.0.0.1:8888/callback' },
                ], note: 'After changing credentials, sign in once from the Pi with <code>venv/bin/python src/spotify_auth.py</code> (as your normal user). The display reconnects automatically within a minute.' },
                { title: 'Polling', fields: [
                    { path: 'spotify.poll_max_interval', label: 'Check for skips every', help: 'Seconds. Lower picks up manual skips faster but uses more API calls.', type: 'number', min: 2, max: 60, def: 10, unit: 's' },
                    { path: 'spotify.poll_paused_interval', label: 'While paused, check every', type: 'number', min: 5, max: 300, def: 20, unit: 's' },
                    { path: 'spotify.poll_idle_interval', label: 'When nothing is playing, check every', type: 'number', min: 5, max: 300, def: 30, unit: 's' },
                ]},
            ],
        },
        {
            id: 'weather', icon: '🌤️', title: 'Weather', desc: 'Uses a free OpenWeatherMap API key.',
            cards: [
                { title: 'Weather mode', fields: [
                    { path: 'weather.enabled', label: 'Enabled', type: 'toggle', def: false },
                    { path: 'weather.api_key', label: 'OpenWeatherMap API key', type: 'secret', dependsOn: 'weather.enabled' },
                    { path: 'weather.location', label: 'Location', help: 'City,State,Country, e.g. <code>Arlington,Virginia,US</code>', type: 'text', dependsOn: 'weather.enabled' },
                    { path: 'weather.units', label: 'Units', type: 'segmented', options: [['imperial', '°F'], ['metric', '°C']], def: 'imperial', dependsOn: 'weather.enabled' },
                ]},
                { title: 'Weather on the 8s', fields: [
                    { path: 'weather_on_8s.enabled', label: 'Enabled', help: 'Takes over the display at :08, :18, :28, :38, :48 and :58.', type: 'toggle', def: false },
                    { path: 'weather_on_8s.api_key', label: 'OpenWeatherMap API key', type: 'secret', dependsOn: 'weather_on_8s.enabled' },
                    { path: 'weather_on_8s.location', label: 'Location', type: 'text', dependsOn: 'weather_on_8s.enabled' },
                    { path: 'weather_on_8s.units', label: 'Units', type: 'segmented', options: [['imperial', '°F'], ['metric', '°C']], def: 'imperial', dependsOn: 'weather_on_8s.enabled' },
                    { path: 'weather_on_8s.display_duration', label: 'Show for', type: 'number', min: 10, max: 300, def: 90, unit: 's', dependsOn: 'weather_on_8s.enabled' },
                ]},
            ],
        },
        {
            id: 'sports', icon: '🏈', title: 'Sports', desc: 'Live scores from ESPN. No API key needed.',
            cards: [
                { title: 'Team', fields: [
                    { path: 'sports.enabled', label: 'Live scores', help: 'When off, the Sports mode shows sample data labelled DEMO.', type: 'toggle', def: false },
                    { path: 'sports.league', label: 'League', type: 'select', def: 'NFL', dependsOn: 'sports.enabled',
                      options: [['NFL', 'NFL'], ['NBA', 'NBA'], ['WNBA', 'WNBA'], ['MLB', 'MLB'], ['NHL', 'NHL'], ['MLS', 'MLS'], ['NCAAF', 'College football'], ['NCAAM', "Men's college basketball"]] },
                    { path: 'sports.team', label: 'Team abbreviation', help: 'As ESPN shows it, e.g. <code>GB</code>, <code>NO</code>, <code>LAL</code>, <code>NYY</code>.', type: 'text', upper: true, dependsOn: 'sports.enabled' },
                    { path: 'sports.update_interval', label: 'Refresh during a live game every', type: 'number', min: 15, max: 600, def: 60, unit: 's', dependsOn: 'sports.enabled' },
                ]},
            ],
        },
        {
            id: 'screensavers', icon: '✨', title: 'Screensavers', desc: 'Animated modes you can pick from the dashboard.',
            cards: [
                { title: 'Pipes', fields: [
                    { path: 'screensavers.pipes.enabled', label: 'Enabled', type: 'toggle', def: true },
                    { path: 'screensavers.pipes.num_pipes', label: 'Number of pipes', type: 'number', min: 1, max: 12, def: 4 },
                    { path: 'screensavers.pipes.fade_trail', label: 'Fading trails', type: 'toggle', def: true },
                ]},
                { title: 'DVD logo', fields: [
                    { path: 'screensavers.dvd_logo.enabled', label: 'Enabled', type: 'toggle', def: true },
                ]},
            ],
        },
        {
            id: 'hardware', icon: '🔌', title: 'Hardware', desc: 'LED panel wiring and image tuning.',
            cards: [
                { title: 'LED panel', badge: ['Restart required', 'warn'], fields: [
                    { path: 'display.hardware_mapping', label: 'Adapter board', type: 'select', def: 'adafruit-hat', options: [
                        ['adafruit-hat', 'Adafruit Bonnet / HAT'], ['adafruit-hat-pwm', 'Adafruit Bonnet / HAT (PWM mod)'],
                        ['regular', 'Direct GPIO wiring'], ['regular-pi1', 'Direct GPIO (Pi 1)'], ['classic', 'Classic'], ['classic-pi1', 'Classic (Pi 1)']] },
                    { path: 'display.rows', label: 'Panel rows', type: 'number', min: 8, max: 128, def: 64 },
                    { path: 'display.cols', label: 'Panel columns', type: 'number', min: 8, max: 128, def: 64 },
                    { path: 'display.gpio_slowdown', label: 'GPIO slowdown', help: 'Raise this if the image flickers or shows garbage. 1–2 for Pi Zero 2, 3–4 for Pi 4.', type: 'number', min: 0, max: 5, def: 2 },
                    { path: 'display.pwm_bits', label: 'Colour depth (PWM bits)', help: 'Lower = less flicker, fewer colours.', type: 'number', min: 1, max: 11, def: 11 },
                    { path: 'display.led_rgb_sequence', label: 'Colour order', help: 'Change if red and blue look swapped.', type: 'select', def: 'RGB',
                      options: ['RGB', 'RBG', 'GRB', 'GBR', 'BRG', 'BGR'].map(v => [v, v]) },
                ], note: 'Apply with <code>sudo systemctl restart spotify-display</code>.' },
                { title: 'Album art', fields: [
                    { path: 'image_processing.enhance_contrast', label: 'Boost contrast', type: 'toggle', def: true },
                    { path: 'image_processing.contrast_factor', label: 'Contrast amount', type: 'number', min: 1, max: 2, step: 0.05, def: 1.2, dependsOn: 'image_processing.enhance_contrast' },
                    { path: 'image_processing.enhance_saturation', label: 'Boost saturation', type: 'toggle', def: true },
                    { path: 'image_processing.saturation_factor', label: 'Saturation amount', type: 'number', min: 1, max: 2, step: 0.05, def: 1.1, dependsOn: 'image_processing.enhance_saturation' },
                ]},
            ],
        },
        {
            id: 'security', icon: '🔒', title: 'Security', desc: 'Who can change these settings.',
            cards: [
                { title: 'Admin login', fields: [
                    { path: 'web_server.admin_username', label: 'Username', type: 'text', def: 'admin' },
                    { path: 'web_server.admin_password', label: 'New password', help: 'Leave blank to keep the current password.', type: 'newpassword' },
                ]},
                { title: 'Web server', badge: ['Restart required', 'warn'], fields: [
                    { path: 'web_server.port', label: 'Port', type: 'number', min: 1, max: 65535, def: 5000 },
                ]},
            ],
        },
        { id: 'advanced', icon: '🧩', title: 'Advanced', desc: 'Edit the raw config.json. Everything above is saved here too.', json: true },
    ];

    // ------------------------------------------------------------------
    // State
    // ------------------------------------------------------------------
    let saved = null;     // config as last loaded from the server
    let draft = null;     // working copy edited by the form
    let newPassword = ''; // kept outside draft so the real password is never echoed into a field
    let lastStatus = null;

    const $ = (sel, root = document) => root.querySelector(sel);
    const clone = obj => JSON.parse(JSON.stringify(obj));

    function getPath(obj, path) {
        return path.split('.').reduce((o, k) => (o == null ? undefined : o[k]), obj);
    }
    function setPath(obj, path, value) {
        const keys = path.split('.');
        let o = obj;
        keys.slice(0, -1).forEach(k => { if (typeof o[k] !== 'object' || o[k] === null) o[k] = {}; o = o[k]; });
        o[keys[keys.length - 1]] = value;
    }
    function valueOf(field) {
        const v = getPath(draft, field.path);
        return v === undefined ? field.def : v;
    }
    function escapeHtml(s) {
        return String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
    }

    // ------------------------------------------------------------------
    // Rendering
    // ------------------------------------------------------------------
    function renderNav() {
        $('#nav').innerHTML = SECTIONS.map(s =>
            `<button data-section="${s.id}" onclick="showSection('${s.id}', true)"><span class="icon">${s.icon}</span>${s.title}</button>`
        ).join('');
    }

    function renderSections() {
        $('#sections').innerHTML = SECTIONS.map(section => {
            const head = `<div class="section-head"><h2>${section.title}</h2><p>${section.desc}</p></div>`;
            if (section.json) {
                return `<section class="section" id="section-${section.id}">${head}
                    <div class="card">
                        <textarea class="editor" id="jsonEditor" spellcheck="false" aria-label="config.json"></textarea>
                        <div class="errors" id="jsonErrors"></div>
                        <div class="editor-actions">
                            <button class="btn btn-primary btn-sm" onclick="applyJson()">Apply JSON</button>
                            <button class="btn btn-sm" onclick="validateJson()">Validate</button>
                            <button class="btn btn-sm" onclick="formatJson()">Format</button>
                            <button class="btn btn-ghost btn-sm" onclick="refreshJson()">Reset to saved</button>
                        </div>
                    </div></section>`;
            }
            const cards = section.cards.map(card => {
                const badge = card.badge ? `<span class="badge ${card.badge[1]}">${card.badge[0]}</span>` : '';
                const status = card.status === 'spotify' ? `<span id="spotifyBadge"></span>` : '';
                return `<div class="card">
                    <div class="card-title">${card.title}${badge}${status}</div>
                    <div class="card-body">${card.fields.map(renderField).join('')}</div>
                    ${card.note ? `<div class="card-note">${card.note}</div>` : ''}
                </div>`;
            }).join('');
            return `<section class="section" id="section-${section.id}">${head}${cards}</section>`;
        }).join('');
        bindFields();
        updateDependencies();
    }

    function renderField(f) {
        const id = 'f-' + f.path.replace(/\./g, '-');
        const v = valueOf(f);
        let control = '';
        switch (f.type) {
            case 'toggle':
                control = `<label class="switch"><input type="checkbox" id="${id}" ${v ? 'checked' : ''}><span class="slider"></span></label>`;
                break;
            case 'select':
                control = `<select class="select" id="${id}">${f.options.map(([val, text]) =>
                    `<option value="${escapeHtml(val)}" ${val === v ? 'selected' : ''}>${escapeHtml(text)}</option>`).join('')}</select>`;
                break;
            case 'segmented':
                control = `<div class="segmented" id="${id}" role="radiogroup">${f.options.map(([val, text]) =>
                    `<button type="button" role="radio" data-value="${escapeHtml(val)}" class="${val === v ? 'active' : ''}" aria-checked="${val === v}">${escapeHtml(text)}</button>`).join('')}</div>`;
                break;
            case 'range':
                control = `<div class="range-wrap"><input type="range" id="${id}" min="${f.min}" max="${f.max}" value="${v}"><output id="${id}-out">${v}${f.suffix || ''}</output></div>`;
                break;
            case 'number':
                control = `<input class="input" type="number" id="${id}" min="${f.min}" max="${f.max}" step="${f.step || 1}" value="${escapeHtml(v)}">${f.unit ? `<span class="help">${f.unit}</span>` : ''}`;
                break;
            case 'secret':
                control = `<div class="input-wrap"><input class="input" type="password" id="${id}" value="${escapeHtml(v)}" autocomplete="off" spellcheck="false"><button type="button" class="reveal" data-for="${id}">Show</button></div>`;
                break;
            case 'newpassword':
                control = `<div class="input-wrap"><input class="input" type="password" id="${id}" value="${escapeHtml(newPassword)}" autocomplete="new-password" placeholder="••••••••"><button type="button" class="reveal" data-for="${id}">Show</button></div>`;
                break;
            default:
                control = `<input class="input" type="text" id="${id}" value="${escapeHtml(v)}" placeholder="${escapeHtml(f.placeholder || '')}" spellcheck="false"${f.upper ? ' style="text-transform: uppercase"' : ''}>`;
        }
        return `<div class="field" data-path="${f.path}">
            <div><label class="field-label" for="${id}">${f.label}</label>${f.help ? `<div class="help">${f.help}</div>` : ''}</div>
            <div class="control">${control}</div>
        </div>`;
    }

    function allFields() {
        return SECTIONS.flatMap(s => (s.cards || []).flatMap(c => c.fields));
    }

    function bindFields() {
        allFields().forEach(f => {
            const id = 'f-' + f.path.replace(/\./g, '-');
            const el = document.getElementById(id);
            if (!el) return;
            if (f.type === 'segmented') {
                el.querySelectorAll('button').forEach(btn => btn.addEventListener('click', () => {
                    el.querySelectorAll('button').forEach(b => { b.classList.remove('active'); b.setAttribute('aria-checked', 'false'); });
                    btn.classList.add('active'); btn.setAttribute('aria-checked', 'true');
                    setPath(draft, f.path, btn.dataset.value); changed();
                }));
                return;
            }
            el.addEventListener('input', () => {
                if (f.type === 'toggle') setPath(draft, f.path, el.checked);
                else if (f.type === 'range') {
                    setPath(draft, f.path, Number(el.value));
                    document.getElementById(id + '-out').textContent = el.value + (f.suffix || '');
                } else if (f.type === 'number') {
                    const n = Number(el.value);
                    const ok = el.value !== '' && !Number.isNaN(n) && n >= f.min && n <= f.max;
                    el.classList.toggle('invalid', !ok);
                    if (ok) setPath(draft, f.path, n);
                } else if (f.type === 'newpassword') newPassword = el.value;
                else setPath(draft, f.path, f.upper ? el.value.toUpperCase().trim() : el.value.trim());
                changed();
            });
            if (f.type === 'toggle') el.addEventListener('change', updateDependencies);
        });
        document.querySelectorAll('.reveal').forEach(btn => btn.addEventListener('click', () => {
            const input = document.getElementById(btn.dataset.for);
            const show = input.type === 'password';
            input.type = show ? 'text' : 'password';
            btn.textContent = show ? 'Hide' : 'Show';
        }));
    }

    function updateDependencies() {
        allFields().filter(f => f.dependsOn).forEach(f => {
            const row = document.querySelector(`.field[data-path="${f.path}"]`);
            const on = !!getPath(draft, f.dependsOn);
            if (row) row.classList.toggle('disabled', !on);
        });
    }

    function showSection(id, fromClick) {
        document.querySelectorAll('.nav button').forEach(b => b.classList.toggle('active', b.dataset.section === id));
        document.querySelectorAll('.section').forEach(s => s.classList.toggle('active', s.id === 'section-' + id));
        if (id === 'advanced') refreshJson(true);
        try { localStorage.setItem('adminSection', id); } catch (e) { /* storage unavailable */ }
        if (fromClick && window.innerWidth <= 860) document.getElementById('nav').scrollIntoView({ block: 'start', behavior: 'smooth' });
    }

    // ------------------------------------------------------------------
    // Dirty tracking / save
    // ------------------------------------------------------------------
    function isDirty() {
        return newPassword !== '' || JSON.stringify(draft) !== JSON.stringify(saved);
    }
    function changed() {
        updateDependencies();
        const invalid = !!document.querySelector('.input.invalid');
        $('#savebarText').textContent = invalid ? 'Fix the highlighted value to save' : 'You have unsaved changes';
        $('#saveBtn').disabled = invalid;
        $('#savebar').classList.toggle('show', invalid || isDirty());
    }
    function discardChanges() {
        draft = clone(saved); newPassword = '';
        renderSections(); showSection(currentSection());
        changed();
    }
    function currentSection() {
        const active = document.querySelector('.nav button.active');
        return active ? active.dataset.section : 'general';
    }

    async function saveChanges(configOverride) {
        const config = configOverride ? clone(configOverride) : clone(draft);
        if (!configOverride && newPassword) {
            if (newPassword.length < 6) { toast('Password must be at least 6 characters', true); return false; }
            setPath(config, 'web_server.admin_password', newPassword);
        }
        if (document.querySelector('.input.invalid')) { toast('Fix the highlighted values first', true); return false; }

        const btn = $('#saveBtn'); btn.disabled = true; btn.textContent = 'Saving…';
        try {
            const v = await api('/api/admin/config/validate', config);
            if (!v.ok) { toast((v.data.errors || [v.data.error || 'Invalid configuration']).join(' · '), true); return false; }
            const r = await api('/api/admin/config', config);
            if (!r.ok) { toast(r.data.error || 'Save failed', true); return false; }
            saved = clone(config); draft = clone(config); newPassword = '';
            renderSections(); showSection(currentSection()); changed();
            toast('Saved. Changes are live.');
            refreshStatus(); checkPasswordBanner();
            return true;
        } catch (e) {
            toast('Network error: ' + e.message, true); return false;
        } finally {
            btn.textContent = 'Save changes';
            btn.disabled = !!document.querySelector('.input.invalid');
        }
    }

    async function api(url, body) {
        const res = await fetch(url, {
            method: body ? 'POST' : 'GET',
            headers: body ? { 'Content-Type': 'application/json' } : {},
            body: body ? JSON.stringify(body) : undefined,
        });
        if (res.status === 401) { window.location.href = '/login'; throw new Error('Not signed in'); }
        let data = {};
        try { data = await res.json(); } catch (e) { /* non-JSON */ }
        return { ok: res.ok, data };
    }

    // ------------------------------------------------------------------
    // Advanced JSON editor
    // ------------------------------------------------------------------
    function refreshJson(keepIfDirty) {
        const ed = $('#jsonEditor'); if (!ed) return;
        if (keepIfDirty && ed.dataset.touched === '1') return;
        ed.value = JSON.stringify(draft, null, 2); ed.dataset.touched = '0';
        $('#jsonErrors').classList.remove('show');
        ed.oninput = () => { ed.dataset.touched = '1'; };
    }
    function parseJson() {
        try { return JSON.parse($('#jsonEditor').value); }
        catch (e) { showJsonErrors(['Invalid JSON: ' + e.message]); return null; }
    }
    function showJsonErrors(errors) {
        const box = $('#jsonErrors');
        box.innerHTML = `<ul>${errors.map(e => `<li>${escapeHtml(e)}</li>`).join('')}</ul>`;
        box.classList.add('show');
    }
    function formatJson() { const c = parseJson(); if (c) { $('#jsonEditor').value = JSON.stringify(c, null, 2); $('#jsonErrors').classList.remove('show'); } }
    async function validateJson() {
        const c = parseJson(); if (!c) return;
        const r = await api('/api/admin/config/validate', c);
        if (r.ok) { $('#jsonErrors').classList.remove('show'); toast('Configuration is valid'); }
        else showJsonErrors(r.data.errors || [r.data.error || 'Invalid configuration']);
    }
    async function applyJson() {
        const c = parseJson(); if (!c) return;
        if (await saveChanges(c)) refreshJson();
    }

    // ------------------------------------------------------------------
    // Status tiles
    // ------------------------------------------------------------------
    const MODE_NAMES = Object.fromEntries(MODES.map(([k, v]) => [k, v.replace(/ \(.*\)| screensaver/, '')]));

    async function refreshStatus() {
        try {
            const res = await fetch('/api/status');
            const s = await res.json();
            lastStatus = s;
            $('#statMode').textContent = MODE_NAMES[s.current_mode] || s.current_mode || '–';
            $('#statModeSub').textContent = s.manual_mode ? 'Picked manually' : 'Automatic';
            $('#statBrightness').textContent = s.brightness + '%';
            $('#statUptime').textContent = formatUptime(s.uptime);

            const dot = $('#statSpotifyDot');
            let label, sub, cls, badge;
            if (s.spotify_connected === false) {
                label = 'Not linked'; cls = 'bad';
                sub = s.spotify_error || 'Run spotify_auth.py on the Pi';
                badge = '<span class="badge bad">Not linked</span>';
            } else if (s.spotify_playing && s.current_track) {
                label = 'Playing'; cls = 'ok';
                sub = `${s.current_track.track_name} · ${s.current_track.artist_name}`;
                badge = '<span class="badge ok">Connected</span>';
            } else {
                label = s.current_track ? 'Paused' : 'Idle'; cls = 'warn';
                sub = s.current_track ? s.current_track.track_name : 'Nothing playing';
                badge = '<span class="badge ok">Connected</span>';
            }
            $('#statSpotify').textContent = label;
            $('#statSpotifySub').textContent = sub;
            $('#statSpotifySub').title = sub;
            dot.className = 'dot ' + cls;
            const b = document.getElementById('spotifyBadge'); if (b) b.innerHTML = badge;
        } catch (e) {
            $('#statSpotify').textContent = 'Offline';
            $('#statSpotifyDot').className = 'dot bad';
        }
    }
    function formatUptime(sec) {
        if (sec == null) return '–';
        const d = Math.floor(sec / 86400), h = Math.floor(sec % 86400 / 3600), m = Math.floor(sec % 3600 / 60);
        return d ? `${d}d ${h}h` : h ? `${h}h ${m}m` : `${m}m`;
    }

    // ------------------------------------------------------------------
    // Misc
    // ------------------------------------------------------------------
    function toast(message, isError) {
        const el = document.createElement('div');
        el.className = 'toast' + (isError ? ' error' : '');
        el.textContent = message;
        $('#toasts').appendChild(el);
        setTimeout(() => el.remove(), isError ? 7000 : 3500);
    }

    async function checkPasswordBanner() {
        try {
            const r = await fetch('/api/auth/check');
            const d = await r.json();
            if (!d.authenticated) { window.location.href = '/login'; return false; }
            $('#passwordBanner').classList.toggle('show', !!d.default_password);
            return true;
        } catch (e) { return false; }
    }

    async function logout() {
        try { await fetch('/api/auth/logout', { method: 'POST' }); } finally { window.location.href = '/login'; }
    }

    window.addEventListener('beforeunload', e => { if (draft && isDirty()) { e.preventDefault(); e.returnValue = ''; } });

    async function init() {
        renderNav();
        if (!await checkPasswordBanner()) return;
        const r = await api('/api/admin/config');
        if (!r.ok) { $('#sections').innerHTML = '<div class="skeleton">Couldn\'t load settings.</div>'; return; }
        saved = r.data;
        draft = clone(saved);
        renderSections();
        let start = 'general';
        try { start = localStorage.getItem('adminSection') || start; } catch (e) { /* ignore */ }
        if (!SECTIONS.some(s => s.id === start)) start = 'general';
        showSection(start);
        refreshStatus();
        setInterval(refreshStatus, 5000);
    }
    init();
    </script>
</body>
</html>

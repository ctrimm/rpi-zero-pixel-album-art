<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign in · LED Matrix Display</title>
    <style>
        :root {
            --bg: #0f0f10; --surface: #18181a; --surface-2: #202023; --border: #2e2e33;
            --text: #f2f2f3; --muted: #a1a1aa; --faint: #71717a;
            --accent: #1DB954; --accent-hover: #1ed760; --accent-soft: rgba(29, 185, 84, 0.12);
            --danger: #f04a4a;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Ubuntu, sans-serif;
            background: radial-gradient(1200px 600px at 50% -10%, rgba(29, 185, 84, 0.10), transparent 60%), var(--bg);
            color: var(--text); min-height: 100vh;
            display: flex; align-items: center; justify-content: center; padding: 24px 16px;
            -webkit-font-smoothing: antialiased;
        }
        .login-container {
            width: 100%; max-width: 380px; background: var(--surface);
            border: 1px solid var(--border); border-radius: 16px; padding: 32px 28px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.45);
        }
        .logo { text-align: center; margin-bottom: 28px; }
        .brand-mark {
            width: 48px; height: 48px; margin: 0 auto 14px; border-radius: 10px; padding: 7px;
            display: grid; grid-template-columns: repeat(4, 1fr); gap: 3px;
            background: #000; border: 1px solid var(--border);
        }
        .brand-mark span { border-radius: 50%; background: var(--accent); opacity: .25; }
        .brand-mark span.on { opacity: 1; }
        .logo h1 { font-size: 1.4rem; }
        .logo p { color: var(--muted); font-size: .9rem; margin-top: 4px; }
        .form-group { margin-bottom: 16px; }
        .form-group label { display: block; font-size: .85rem; font-weight: 600; color: var(--muted); margin-bottom: 6px; }
        .form-group input {
            width: 100%; padding: 11px 14px; border-radius: 8px; font: inherit; color: var(--text);
            background: var(--bg); border: 1px solid var(--border); outline: none;
            transition: border-color .15s, box-shadow .15s;
        }
        .form-group input:focus { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
        .btn {
            width: 100%; margin-top: 8px; padding: 12px; border: none; border-radius: 999px;
            background: var(--accent); color: #04140a; font: inherit; font-weight: 700; cursor: pointer;
            transition: background .15s, transform .05s;
        }
        .btn:hover { background: var(--accent-hover); }
        .btn:active { transform: translateY(1px); }
        .btn:disabled { opacity: .6; cursor: default; }
        .message { display: none; padding: 10px 12px; border-radius: 8px; font-size: .88rem; margin-bottom: 16px; }
        .message.error { background: rgba(240, 74, 74, 0.12); color: #fca5a5; border: 1px solid rgba(240, 74, 74, 0.35); }
        .message.success { background: var(--accent-soft); color: var(--accent); border: 1px solid rgba(29, 185, 84, 0.35); }
        .loading { display: none; text-align: center; color: var(--muted); font-size: .88rem; margin-top: 12px; }
        .loading.active { display: block; }
        .back-link { text-align: center; margin-top: 22px; }
        .back-link a { color: var(--faint); text-decoration: none; font-size: .88rem; }
        .back-link a:hover { color: var(--text); }
    </style>
</head>
<body>
    <div class="login-container">
        <div class="logo">
            <div class="brand-mark" aria-hidden="true">
                <span class="on"></span><span></span><span></span><span class="on"></span>
                <span></span><span class="on"></span><span class="on"></span><span></span>
                <span></span><span class="on"></span><span class="on"></span><span></span>
                <span class="on"></span><span></span><span></span><span class="on"></span>
            </div>
            <h1>Admin sign in</h1>
            <p>LED Matrix Display</p>
        </div>

        <div id="message" class="message"></div>

        <form id="loginForm">
            <div class="form-group">
                <label for="username">Username</label>
                <input type="text" id="username" name="username" required autocomplete="username">
            </div>

            <div class="form-group">
                <label for="password">Password</label>
                <input type="password" id="password" name="password" required autocomplete="current-password">
            </div>

            <button type="submit" class="btn" id="loginBtn">Sign In</button>
        </form>

        <div class="loading" id="loading">Signing in...</div>

        <div class="back-link">
            <a href="/">← Back to Display</a>
        </div>
    </div>

    <script>
        const loginForm = document.getElementById('loginForm');
        const loginBtn = document.getElementById('loginBtn');
        const loading = document.getElementById('loading');
        const message = document.getElementById('message');

        // Check if already authenticated
        checkAuth();

        async function checkAuth() {
            try {
                const response = await fetch('/api/auth/check');
                const data = await response.json();

                if (data.authenticated) {
                    // Already logged in, redirect to admin panel
                    window.location.href = '/admin';
                }
            } catch (error) {
                console.error('Error checking auth:', error);
            }
        }

        loginForm.addEventListener('submit', async (e) => {
            e.preventDefault();

            const username = document.getElementById('username').value;
            const password = document.getElementById('password').value;

            // Disable button and show loading
            loginBtn.disabled = true;
            loading.classList.add('active');
            message.style.display = 'none';

            try {
                const response = await fetch('/api/auth/login', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({ username, password }),
                });

                const data = await response.json();

                if (response.ok) {
                    // Success
                    message.className = 'message success';
                    message.textContent = 'Login successful! Redirecting...';
                    message.style.display = 'block';

                    // Redirect to admin panel
                    setTimeout(() => {
                        window.location.href = '/admin';
                    }, 500);
                } else {
                    // Error
                    message.className = 'message error';
                    message.textContent = data.error || 'Login failed';
                    message.style.display = 'block';

                    loginBtn.disabled = false;
                    loading.classList.remove('active');
                }
            } catch (error) {
                message.className = 'message error';
                message.textContent = 'Network error. Please try again.';
                message.style.display = 'block';

                loginBtn.disabled = false;
                loading.classList.remove('active');
            }
        });
    </script>
</body>
</html>
